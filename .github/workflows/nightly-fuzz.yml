name: nightly-fuzz

on:
  schedule:
    # 22:00 UTC daily — finishes overnight, results ready by morning.
    - cron: "0 22 * * *"
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: nightly

jobs:
  fuzz:
    name: Nightly fuzz + invariant (${{ matrix.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      # Scheduled runs only fire from the default branch; a branch matrix covers both
      # main and dev from this one workflow. fail-fast off so one branch doesn't cancel the other.
      fail-fast: false
      matrix:
        branch: [main, dev]
    env:
      MAINNET_RPC_URL: https://eth-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
      ARBITRUM_RPC_URL: https://arb-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
      BASE_RPC_URL: https://base-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
      AVALANCHE_RPC_URL: https://avax-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
      OPTIMISM_RPC_URL: https://opt-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
      LINEA_RPC_URL: https://linea-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
      MANTLE_RPC_URL: https://mantle-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
      HOLESKY_RPC_URL: https://eth-holesky.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
      BERA_CHAIN_RPC_URL: ${{ secrets.BERA_CHAIN_RPC_URL }}
      BOB_RPC_URL: ${{ secrets.BOB_RPC_URL }}
      DERIVE_RPC_URL: ${{ secrets.DERIVE_RPC_URL }}
      FLARE_RPC_URL: ${{ secrets.FLARE_RPC_URL }}
      HYPER_EVM_RPC_URL: ${{ secrets.HYPER_EVM_RPC_URL }}
      KATANA_RPC_URL: ${{ secrets.KATANA_RPC_URL }}
      PLASMA_RPC_URL: ${{ secrets.PLASMA_RPC_URL }}
      PLUME_RPC_URL: ${{ secrets.PLUME_RPC_URL }}
      SCROLL_RPC_URL: ${{ secrets.SCROLL_RPC_URL }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
      SONIC_MAINNET_RPC_URL: ${{ secrets.SONIC_MAINNET_RPC_URL }}
      SWELL_CHAIN_RPC_URL: ${{ secrets.SWELL_CHAIN_RPC_URL }}
      TAC_RPC_URL: ${{ secrets.TAC_RPC_URL }}
      MONAD_RPC_URL: ${{ secrets.MONAD_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # This job always builds cold (no compile cache), and full compiles peak
      # >11 GB in a single solc pipeline — swap keeps the 16 GB runner alive.
      - name: Free disk and add swap for solc memory peak
        run: |
          # This repo + its nested submodules leave little runner-disk headroom,
          # so a 16G swapfile on /mnt overflowed the disk ("No space left on
          # device") and crashed the runner agent before the build. Reclaim the
          # preinstalled toolchains we don't use, then put a right-sized swapfile
          # on the freed root disk to absorb the >11 GB solc compile peak.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/graalvm /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules /usr/share/swift 2>/dev/null || true
          df -h /
          sudo fallocate -l 12G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      - name: Run Forge build
        run: |
          forge --version
          forge build --skip script
        id: build

      - name: Run Forge tests
        # Berachain, Corn and Scroll vaults are being deprecated (ETHFI-35),
        # so their integration suites are skipped in CI.
        run: |
          forge test -vv \
            --skip SymbioticVaultIntegration --skip CreateTimelockTx \
            --skip GoldiVaultIntegration --skip BGTRewardVaultIntegration \
            --skip KodiakIslandIntegration --skip KodiakSwappingIntegration \
            --skip InfraredIntegration --skip HoneyIntegration \
            --skip DolomiteFinanceIntegration --skip BerachainPOLIntegration \
            --skip BeraborrowIntegration --skip BeraETHIntegration \
            --skip ScrollBridgeIntegration
        id: test

      # Scheduled runs notify no one by default, so ping Slack on failure.
      # Requires the SLACK_WEBHOOK_URL repo secret (a Slack incoming webhook).
      - name: Alert Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {"text": "🌙❌ *nightly-fuzz* [${{ matrix.branch }}] failed — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
