name: leaf-canonical

# Leaf JSON is written by forge's vm.serialize* with an unstable key order, which
# makes the files diff wholesale on every regeneration. scripts/normalize_leaves.py
# canonicalizes them (sorted keys, fixed indent — content-preserving); this check
# fails a PR if a regenerated leaf file wasn't normalized before committing.
#
# Runs on every PR (no paths filter) so it always reports a status — required to be
# safe as a mandatory check (a paths-filtered required check blocks PRs that don't
# touch the paths, since the status is never posted). It's python-only and ~seconds.
on:
  pull_request:

jobs:
  leaf-canonical:
    name: leaf-canonical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check leaf JSON is canonical
        run: python3 scripts/normalize_leaves.py --check
